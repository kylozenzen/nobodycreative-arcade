<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e08" />
  <title>Tape Panic — Nobody Arcade</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <div><p>UNAUTHORIZED CABINET 001</p><h1>TAPE PANIC</h1></div>
      <div class="scoreboard"><span>SCORE <strong id="score">0</strong></span><span>BEST <strong id="best">0</strong></span></div>
    </header>
    <section class="stage" id="stage" aria-label="Tape Panic game area">
      <canvas id="game" width="900" height="560"></canvas>
      <div class="overlay" id="overlay">
        <p class="kicker">The late fees have become sentient.</p>
        <h2 id="overlayTitle">Return the good tapes.</h2>
        <p id="overlayCopy">Move the return bin. Catch blue and gold tapes. Avoid the cursed red ones.</p>
        <button id="startButton" type="button">Start shift</button>
        <p class="controls">Drag, tap the sides, or use ← →</p>
      </div>
    </section>
    <footer><span>TIME <strong id="time">45</strong></span><span>LIVES <strong id="lives">♥ ♥ ♥</strong></span><button id="mute" type="button">Sound: off</button></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
